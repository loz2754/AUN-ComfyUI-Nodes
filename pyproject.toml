[project]
name = "aun-comfyui-nodes"
description = "A comprehensive collection of custom nodes for ComfyUI which helps you to create compact, well-organised workflows. Includes a bunch of bypass/mute/collapse controllers, automatic file naming and saving, clever index-driven prompting that matches specific LoRAs to specific prompts. With in-built trigger words management, CivitAI lookup and more..."
version = "2.17.0"
license = {file = "LICENSE"} 
# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["piexif>=1.1.3", "opencv-python-headless>=4.8.0.76", "imageio-ffmpeg>=0.4.9", "requests>=2.31.0"]

[project.urls]
Repository = "https://github.com/loz2754/AUN-ComfyUI-Nodes"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/loz2754/AUN-ComfyUI-Nodes/wiki"
"Bug Tracker" = "https://github.com/loz2754/AUN-ComfyUI-Nodes/issues"

